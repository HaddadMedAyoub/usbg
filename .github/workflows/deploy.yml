name: Build & Deploy to cPanel

# Runs on every push to main, and can be triggered manually from the
# Actions tab (workflow_dispatch). Builds the static site and FTP-syncs
# only the changed files to your cPanel folder.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # NEXT_PUBLIC_* values are baked into the build, so they must exist here.
      # They are stored as GitHub repo secrets (Settings > Secrets and variables
      # > Actions), not in the code.
      - name: Create .env.local
        run: |
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_OPENWEATHER_KEY=${{ secrets.NEXT_PUBLIC_OPENWEATHER_KEY }}
          NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
          EOF

      - name: Build (static export -> ./out)
        run: npm run build

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./out/
          # Plain FTP: the host's firewall can't open passive data ports over
          # encrypted FTPS, so FTPS times out on transfer. Plain FTP works
          # because the firewall's FTP helper can track the passive connection.
          protocol: ftp
          # Don't let the sync wipe these server-side files:
          exclude: |
            **/.git*
            **/.git*/**
            **/.ftp-deploy-sync-state.json
